<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040814" />
      <stop offset="50%" stop-color="#071126" />
      <stop offset="100%" stop-color="#03060f" />
    </linearGradient>
    
    <linearGradient id="redbull-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea0029" />
      <stop offset="100%" stop-color="#ff3366" />
    </linearGradient>

    <linearGradient id="redbull-yellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="telemetry-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea0029" stop-opacity="0.1" />
      <stop offset="40%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.2" />
    </linearGradient>

    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.4" />
    </pattern>

    <style>
      @keyframes pulseLight {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      @keyframes revShift {
        0%, 20% { fill: #22c55e; }
        40%, 60% { fill: #eab308; }
        75%, 90% { fill: #ef4444; }
        95%, 100% { fill: #a855f7; }
      }
      @keyframes telemetryWave {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes drsActive {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; filter: drop-shadow(0 0 6px #00f0ff); }
      }
      @keyframes scanline {
        0% { transform: translateY(-100px); }
        100% { transform: translateY(240px); }
      }
      .telemetry-wave {
        stroke-dasharray: 600;
        animation: telemetryWave 4s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
      }
      .rev-led-1 { animation: revShift 3s infinite 0.1s; }
      .rev-led-2 { animation: revShift 3s infinite 0.2s; }
      .rev-led-3 { animation: revShift 3s infinite 0.3s; }
      .rev-led-4 { animation: revShift 3s infinite 0.4s; }
      .rev-led-5 { animation: revShift 3s infinite 0.5s; }
      .drs-indicator { animation: drsActive 2s infinite ease-in-out; }
      .pulse-dot { animation: pulseLight 1.5s infinite ease-in-out; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, Menlo, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="240" rx="12" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Subtle Racing Grid -->
  <rect width="900" height="240" rx="12" fill="url(#grid)" />

  <!-- Speed Stripes (Red Bull Signature Angles) -->
  <path d="M -20 240 L 160 0 L 195 0 L 15 240 Z" fill="#ea0029" opacity="0.15" />
  <path d="M 10 240 L 190 0 L 210 0 L 30 240 Z" fill="#f59e0b" opacity="0.2" />
  <path d="M 25 240 L 205 0 L 215 0 L 35 240 Z" fill="#ffffff" opacity="0.1" />

  <!-- Tech Telemetry Graph in Background -->
  <path class="telemetry-wave" d="M 280 180 Q 340 140 400 175 T 520 130 T 640 160 T 760 110 T 880 145" fill="none" stroke="url(#telemetry-line-grad)" stroke-width="2.5" />

  <!-- Top Telemetry Bar / Pit HUD -->
  <g transform="translate(35, 24)">
    <!-- Racing LED Tachometer (F1 Steering Wheel Style) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="12" height="6" rx="2" class="rev-led-1" fill="#22c55e" />
      <rect x="16" y="0" width="12" height="6" rx="2" class="rev-led-1" fill="#22c55e" />
      <rect x="32" y="0" width="12" height="6" rx="2" class="rev-led-2" fill="#22c55e" />
      <rect x="48" y="0" width="12" height="6" rx="2" class="rev-led-2" fill="#eab308" />
      <rect x="64" y="0" width="12" height="6" rx="2" class="rev-led-3" fill="#eab308" />
      <rect x="80" y="0" width="12" height="6" rx="2" class="rev-led-3" fill="#ef4444" />
      <rect x="96" y="0" width="12" height="6" rx="2" class="rev-led-4" fill="#ef4444" />
      <rect x="112" y="0" width="12" height="6" rx="2" class="rev-led-5" fill="#a855f7" />
      <rect x="128" y="0" width="12" height="6" rx="2" class="rev-led-5" fill="#a855f7" />
    </g>

    <!-- Telemetry Readouts -->
    <text x="160" y="7" class="font-mono" font-size="10" fill="#64748b" letter-spacing="1.5">SYS // PU: HONDA RBPT-H001</text>
    <text x="380" y="7" class="font-mono" font-size="10" fill="#64748b" letter-spacing="1.5">AERO: HIGH-DOWNFORCE</text>
    
    <!-- DRS Badge -->
    <g transform="translate(560, -3)" class="drs-indicator">
      <rect x="0" y="0" width="46" height="15" rx="3" fill="#00f0ff" fill-opacity="0.15" stroke="#00f0ff" stroke-width="1" />
      <text x="23" y="11" class="font-mono" font-size="9" font-weight="bold" fill="#00f0ff" text-anchor="middle" letter-spacing="1">DRS</text>
    </g>

    <!-- Sector Purple Delta -->
    <g transform="translate(620, -3)">
      <rect x="0" y="0" width="90" height="15" rx="3" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1" />
      <circle cx="9" cy="7.5" r="3" fill="#a855f7" class="pulse-dot" />
      <text x="52" y="11" class="font-mono" font-size="9" font-weight="bold" fill="#c084fc" text-anchor="middle" letter-spacing="0.5">Δ -0.334s (P1)</text>
    </g>

    <!-- Driver Number Stamp -->
    <g transform="translate(730, -8)">
      <text x="90" y="24" class="font-mono" font-size="28" font-weight="900" fill="#ea0029" opacity="0.85" letter-spacing="-1">#01</text>
    </g>
  </g>

  <!-- Horizontal Divider Line -->
  <line x1="35" y1="46" x2="865" y2="46" stroke="#1e293b" stroke-width="1" />

  <!-- Main Identity Content -->
  <g transform="translate(35, 75)">
    <!-- Sub-heading / Callout -->
    <g transform="translate(0, 10)">
      <rect x="0" y="0" width="130" height="20" rx="3" fill="#ea0029" fill-opacity="0.2" stroke="#ea0029" stroke-width="1" />
      <text x="65" y="14" class="font-mono" font-size="9.5" font-weight="bold" fill="#ff4d6d" text-anchor="middle" letter-spacing="1.5">TELEMETRY // BR</text>
      <text x="145" y="14" class="font-mono" font-size="11" fill="#94a3b8" letter-spacing="2">SYSTEMS &amp; PERFORMANCE ENGINEERING</text>
    </g>

    <!-- Primary Name Title -->
    <text x="0" y="70" class="font-mono" font-size="44" font-weight="900" fill="#f8fafc" letter-spacing="3">
      PEDROZA<tspan fill="#ea0029">.</tspan>
    </text>

    <!-- Punchy Description -->
    <text x="2" y="102" class="font-sans" font-size="14.5" fill="#cbd5e1" font-weight="400" letter-spacing="0.4">
      Low-Level Computing <tspan fill="#f59e0b">•</tspan> Applied AI &amp; ML <tspan fill="#f59e0b">•</tspan> Distributed Backend Systems <tspan fill="#f59e0b">•</tspan> Embedded Architecture
    </text>

    <!-- Bottom Precision Tags -->
    <g transform="translate(0, 126)">
      <text x="0" y="12" class="font-mono" font-size="11" fill="#64748b">
        <tspan fill="#00f0ff">&gt;</tspan> Squeezing every clock cycle out of silicon with mechanical sympathy.
      </text>
    </g>
  </g>

  <!-- Right Decorative Telemetry Box -->
  <g transform="translate(735, 90)">
    <rect x="0" y="0" width="130" height="95" rx="6" fill="#0b1329" stroke="#1e293b" stroke-width="1" />
    
    <text x="12" y="20" class="font-mono" font-size="8.5" fill="#64748b" letter-spacing="1">RPM LIMITER</text>
    <text x="12" y="38" class="font-mono" font-size="16" font-weight="bold" fill="#f8fafc">15,000</text>
    <text x="75" y="38" class="font-mono" font-size="10" fill="#a855f7">MAX</text>

    <line x1="12" y1="48" x2="118" y2="48" stroke="#1e293b" stroke-width="1" />

    <text x="12" y="64" class="font-mono" font-size="8.5" fill="#64748b" letter-spacing="1">GEAR / LATENCY</text>
    <text x="12" y="82" class="font-mono" font-size="14" font-weight="bold" fill="#22c55e">8th <tspan font-size="10" fill="#64748b" font-weight="normal">| sub-ms</tspan></text>
  </g>

  <!-- Corner Tech Accent Borders -->
  <path d="M 12 28 L 12 12 L 28 12" fill="none" stroke="#ea0029" stroke-width="2" />
  <path d="M 888 28 L 888 12 L 872 12" fill="none" stroke="#f59e0b" stroke-width="2" />
  <path d="M 12 212 L 12 228 L 28 228" fill="none" stroke="#1e293b" stroke-width="2" />
  <path d="M 888 212 L 888 228 L 872 228" fill="none" stroke="#00f0ff" stroke-width="2" />
</svg>
