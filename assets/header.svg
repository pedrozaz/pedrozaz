<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 130" width="100%" height="130">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111c" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <linearGradient id="racing-stripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea0029" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      @keyframes pulseLight {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      .shift-led { animation: pulseLight 3s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Base Card -->
  <rect width="800" height="130" rx="8" fill="url(#bg)" stroke="#1e293b" stroke-width="1" />

  <!-- Top Racing Accent Stripe -->
  <rect x="0" y="0" width="800" height="3" rx="1" fill="url(#racing-stripe)" />

  <!-- Subtle Side Stripe -->
  <rect x="0" y="3" width="3" height="127" fill="#ea0029" opacity="0.8" />

  <!-- Left Content -->
  <g transform="translate(32, 38)">
    <!-- Title -->
    <text x="0" y="24" class="mono" font-size="28" font-weight="700" fill="#f1f5f9" letter-spacing="1.5">
      pedroza<tspan fill="#ea0029">.</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="52" class="sans" font-size="13.5" fill="#94a3b8" font-weight="400" letter-spacing="0.5">
      Systems &amp; Low-Level Engineer <tspan fill="#475569">•</tspan> Applied AI <tspan fill="#475569">•</tspan> Performance
    </text>
  </g>

  <!-- Right Minimalist LED & Status Indicator -->
  <g transform="translate(620, 48)">
    <!-- Rev Lights (Clean Minimalist Shift Strip) -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="0" r="2.5" fill="#22c55e" opacity="0.85" />
      <circle cx="10" cy="0" r="2.5" fill="#22c55e" opacity="0.85" />
      <circle cx="20" cy="0" r="2.5" fill="#eab308" opacity="0.85" />
      <circle cx="30" cy="0" r="2.5" fill="#eab308" opacity="0.85" />
      <circle cx="40" cy="0" r="2.5" fill="#ef4444" opacity="0.85" />
      <circle cx="50" cy="0" r="2.5" fill="#ef4444" opacity="0.85" />
      <circle cx="60" cy="0" r="2.5" fill="#a855f7" class="shift-led" />
      <circle cx="70" cy="0" r="2.5" fill="#a855f7" class="shift-led" />
    </g>

    <!-- Minimal Telemetry Badge -->
    <g transform="translate(0, 20)">
      <text x="0" y="0" class="mono" font-size="10" fill="#64748b" letter-spacing="1">LOCATION // BR</text>
      <text x="0" y="16" class="mono" font-size="10" fill="#475569" letter-spacing="1">PERF // LOW-OVERHEAD</text>
    </g>
  </g>
</svg>
