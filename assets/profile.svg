<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 208" role="img" aria-labelledby="title desc">
  <title id="title">Current focus</title>
  <desc id="desc">Applied AI at the intersection of distributed systems and performance engineering.</desc>

  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111318"/>
      <stop offset="1" stop-color="#08090c"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67d4ff"/>
      <stop offset="0.52" stop-color="#79a7ff"/>
      <stop offset="1" stop-color="#aa8bff"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0" stop-color="#6fa8ff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#6fa8ff" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: 40px 37px; }
      .flow { stroke-dasharray: 3 10; animation: flow 7s linear infinite; }
      .node-b { animation: node 3.2s ease-in-out infinite .6s; }
      .node-c { animation: node 3.2s ease-in-out infinite 1.2s; }

      @keyframes pulse {
        0%, 100% { opacity: .55; transform: scale(.88); }
        50% { opacity: 1; transform: scale(1.14); }
      }

      @keyframes flow {
        to { stroke-dashoffset: -52; }
      }

      @keyframes node {
        0%, 100% { opacity: .48; }
        50% { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>
  </defs>

  <rect x="1" y="1" width="918" height="206" rx="24" fill="url(#surface)" stroke="#ffffff" stroke-opacity=".11"/>
  <circle cx="760" cy="84" r="134" fill="url(#glow)" filter="url(#blur)"/>

  <g class="sans">
    <circle class="pulse" cx="40" cy="37" r="4" fill="#74d8ff"/>
    <text x="53" y="41" fill="#aeb6c5" font-size="12" font-weight="600" letter-spacing="1.7">CURRENT FOCUS</text>

    <text x="36" y="91" fill="#f7f8fa" font-size="26" font-weight="650">Applied intelligence.</text>
    <text x="36" y="123" fill="#9ca5b5" font-size="22" font-weight="500">Engineered as a system.</text>

    <text x="36" y="168" fill="#777f8e" font-size="13">Uniube ↔ Martins S/A · TI / Datalab / GenAI</text>
  </g>

  <g class="mono" font-size="11" fill="#aeb6c5">
    <path class="flow" d="M548 104 C602 48 660 157 718 102 S826 56 875 103" fill="none" stroke="url(#accent)" stroke-width="1.6" stroke-linecap="round" opacity=".72"/>

    <circle cx="548" cy="104" r="5" fill="#08090c" stroke="#67d4ff" stroke-width="2"/>
    <circle class="node-b" cx="718" cy="102" r="5" fill="#08090c" stroke="#79a7ff" stroke-width="2"/>
    <circle class="node-c" cx="875" cy="103" r="5" fill="#08090c" stroke="#aa8bff" stroke-width="2"/>

    <text x="548" y="134" text-anchor="middle">AI</text>
    <text x="718" y="134" text-anchor="middle">SYSTEMS</text>
    <text x="875" y="134" text-anchor="middle">IMPACT</text>
  </g>
</svg>
