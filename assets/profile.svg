<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="60%" stop-color="#0c1322" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Senna Iconic Colors -->
    <linearGradient id="senna-yellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd100" />
      <stop offset="100%" stop-color="#ffbe00" />
    </linearGradient>

    <linearGradient id="senna-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#009c3b" />
      <stop offset="100%" stop-color="#007f30" />
    </linearGradient>

    <linearGradient id="senna-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#002776" />
      <stop offset="100%" stop-color="#001a4e" />
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <radialGradient id="ambient-glow" cx="100%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#ffd100" stop-opacity="0.07" />
      <stop offset="40%" stop-color="#009c3b" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Grid Overlay -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.35" />
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      @keyframes stripeFlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes speedDash {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      .senna-band {
        animation: stripeFlow 5s ease-in-out infinite;
      }
      .racing-trace {
        stroke-dasharray: 180 400;
        animation: speedDash 7s linear infinite;
      }
      .glow-layer {
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, Menlo, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Base Canvas (Clipped to round corners) -->
  <clipPath id="canvas-clip">
    <rect width="850" height="560" rx="14" />
  </clipPath>

  <g clip-path="url(#canvas-clip)">
    <!-- Base Dark Background -->
    <rect width="850" height="560" fill="url(#bg-grad)" />
    
    <!-- Subtle Grid -->
    <rect width="850" height="560" fill="url(#grid)" />

    <!-- Ambient Glow on Right -->
    <rect width="850" height="560" fill="url(#ambient-glow)" class="glow-layer" />

    <!-- Background Racing Trajectory Line -->
    <path class="racing-trace" d="M -50 420 C 250 440, 500 320, 680 180 L 880 120" fill="none" stroke="#ffd100" stroke-width="1.5" stroke-opacity="0.2" />

    <!-- ================= PROMINENT SENNA STRIPES (RIGHT FLANK) ================= -->
    <g class="senna-band" transform="translate(660, -20)">
      <!-- Blue Stripe (Inner) -->
      <polygon points="0,0 24,0 -60,600 -84,600" fill="url(#senna-blue)" opacity="0.9" />
      
      <!-- Green Stripe (Middle) -->
      <polygon points="32,0 64,0 -28,600 -60,600" fill="url(#senna-green)" opacity="0.95" />
      
      <!-- Yellow Stripe (Outer / Bold) -->
      <polygon points="72,0 200,0 120,600 -20,600" fill="url(#senna-yellow)" opacity="0.95" />

      <!-- Subtle Helmet Accent Line on Stripe Edge -->
      <line x1="-84" y1="600" x2="0" y2="0" stroke="#ffffff" stroke-width="1" opacity="0.2" />
    </g>

    <!-- Left Border Accent Sashes -->
    <rect x="0" y="35" width="4" height="65" rx="2" fill="#ffd100" />
    <rect x="0" y="105" width="4" height="25" rx="2" fill="#009c3b" />
    <rect x="0" y="135" width="4" height="15" rx="2" fill="#002776" />

    <!-- ================= HEADER SECTION ================= -->
    <g transform="translate(45, 45)">
      <!-- Badge -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="135" height="22" rx="4" fill="#ffd100" fill-opacity="0.15" stroke="#ffd100" stroke-width="1" />
        <circle cx="12" cy="11" r="3.5" fill="#ffd100" />
        <text x="24" y="15" class="font-mono" font-size="10.5" font-weight="bold" fill="#ffd100" letter-spacing="1">SYSTEMS // DEV</text>
      </g>

      <!-- Main Name -->
      <text x="0" y="65" class="font-mono" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="2">
        pedroza<tspan fill="#ffd100">.</tspan>
      </text>

      <!-- Subtitle -->
      <text x="2" y="94" class="font-sans" font-size="15" fill="#ffffff" font-weight="500" letter-spacing="0.3">
        Low-Level Computing <tspan fill="#ffd100">•</tspan> Applied AI &amp; ML <tspan fill="#009c3b">•</tspan> Distributed Architecture
      </text>
    </g>

    <!-- Section Divider Line -->
    <line x1="45" y1="165" x2="680" y2="165" stroke="#253347" stroke-width="1" />

    <!-- ================= ABOUT SECTION (HIGH CONTRAST) ================= -->
    <g transform="translate(45, 195)">
      <text x="0" y="0" class="font-mono" font-size="12" font-weight="bold" fill="#ffd100" letter-spacing="1.5">// ABOUT</text>
      
      <text x="0" y="28" class="font-sans" font-size="15" fill="#ffffff" font-weight="500">
        Undergraduate engineer from Brazil.
      </text>
      <text x="0" y="52" class="font-sans" font-size="14.5" fill="#e2e8f0" font-weight="400">
        Focused on building memory-safe software, understanding kernel internals, and deploying
      </text>
      <text x="0" y="74" class="font-sans" font-size="14.5" fill="#cbd5e1" font-weight="400">
        high-throughput machine learning pipelines and distributed backend services.
      </text>
    </g>

    <!-- ================= TECH STACK GRID ================= -->
    <g transform="translate(45, 315)">
      <text x="0" y="0" class="font-mono" font-size="12" font-weight="bold" fill="#ffd100" letter-spacing="1.5">// TECH STACK</text>

      <!-- Category 1: Languages -->
      <g transform="translate(0, 18)">
        <text x="0" y="17" class="font-mono" font-size="11.5" font-weight="bold" fill="#94a3b8">LANGUAGES</text>
        
        <g transform="translate(130, 0)">
          <!-- Rust -->
          <rect x="0" y="0" width="70" height="26" rx="5" fill="#131d2e" stroke="#334766" stroke-width="1" />
          <text x="35" y="17.5" class="font-mono" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Rust</text>

          <!-- C -->
          <rect x="78" y="0" width="46" height="26" rx="5" fill="#131d2e" stroke="#334766" stroke-width="1" />
          <text x="101" y="17.5" class="font-mono" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">C</text>

          <!-- Python -->
          <rect x="132" y="0" width="82" height="26" rx="5" fill="#131d2e" stroke="#334766" stroke-width="1" />
          <text x="173" y="17.5" class="font-mono" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Python</text>

          <!-- SQL -->
          <rect x="222" y="0" width="60" height="26" rx="5" fill="#131d2e" stroke="#334766" stroke-width="1" />
          <text x="252" y="17.5" class="font-mono" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">SQL</text>

          <!-- Java -->
          <rect x="290" y="0" width="65" height="26" rx="5" fill="#131d2e" stroke="#334766" stroke-width="1" />
          <text x="322.5" y="17.5" class="font-mono" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Java</text>
        </g>
      </g>

      <!-- Category 2: Tools & Environments -->
      <g transform="translate(0, 56)">
        <text x="0" y="17" class="font-mono" font-size="11.5" font-weight="bold" fill="#94a3b8">ENVIRONMENT</text>
        
        <g transform="translate(130, 0)">
          <!-- Linux -->
          <rect x="0" y="0" width="75" height="26" rx="5" fill="#131d2e" stroke="#334766" stroke-width="1" />
          <text x="37.5" y="17.5" class="font-mono" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Linux</text>

          <!-- Docker -->
          <rect x="83" y="0" width="80" height="26" rx="5" fill="#131d2e" stroke="#334766" stroke-width="1" />
          <text x="123" y="17.5" class="font-mono" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Docker</text>

          <!-- QEMU -->
          <rect x="171" y="0" width="70" height="26" rx="5" fill="#131d2e" stroke="#334766" stroke-width="1" />
          <text x="206" y="17.5" class="font-mono" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">QEMU</text>

          <!-- Git -->
          <rect x="249" y="0" width="55" height="26" rx="5" fill="#131d2e" stroke="#334766" stroke-width="1" />
          <text x="276.5" y="17.5" class="font-mono" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Git</text>
        </g>
      </g>

      <!-- Category 3: Domains -->
      <g transform="translate(0, 94)">
        <text x="0" y="17" class="font-mono" font-size="11.5" font-weight="bold" fill="#94a3b8">DOMAINS</text>
        
        <g transform="translate(130, 0)">
          <!-- Low-Level -->
          <rect x="0" y="0" width="165" height="26" rx="5" fill="#131d2e" stroke="#334766" stroke-width="1" />
          <text x="82.5" y="17.5" class="font-mono" font-size="11.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">Low-Level Systems</text>

          <!-- Applied AI -->
          <rect x="173" y="0" width="140" height="26" rx="5" fill="#131d2e" stroke="#334766" stroke-width="1" />
          <text x="243" y="17.5" class="font-mono" font-size="11.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">Applied AI / ML</text>

          <!-- Embedded -->
          <rect x="321" y="0" width="155" height="26" rx="5" fill="#131d2e" stroke="#334766" stroke-width="1" />
          <text x="398.5" y="17.5" class="font-mono" font-size="11.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">Embedded Systems</text>
        </g>
      </g>
    </g>

    <!-- ================= FOOTER / PHILOSOPHY ================= -->
    <g transform="translate(45, 490)">
      <line x1="0" y1="0" x2="680" y2="0" stroke="#253347" stroke-width="1" />
      
      <text x="0" y="28" class="font-sans" font-size="12.5" font-style="italic" fill="#94a3b8">
        "I have no idols. I admire work, dedication and competence."
      </text>
      
      <g transform="translate(680, 16)">
        <text x="0" y="12" class="font-mono" font-size="11.5" font-weight="bold" fill="#ffd100" text-anchor="end">guilhermebarb0sa@proton.me</text>
      </g>
    </g>

    <!-- Corner Accents -->
    <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#ffd100" stroke-width="2" />
    <path d="M 12 536 L 12 548 L 24 548" fill="none" stroke="#ffd100" stroke-width="2" />
  </g>

  <!-- Outer Border -->
  <rect width="850" height="560" rx="14" fill="none" stroke="#253347" stroke-width="1.2" />
</svg>
