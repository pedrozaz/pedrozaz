<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 560" width="100%" height="100%">
  <defs>
    <!-- Dark Stealth Base -->
    <linearGradient id="ln-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0e1422" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- LN4 Volt Neon Gradient -->
    <linearGradient id="volt-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d2ff00" />
      <stop offset="100%" stop-color="#a3e635" />
    </linearGradient>

    <linearGradient id="papaya-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff8000" />
      <stop offset="100%" stop-color="#ff5500" />
    </linearGradient>

    <radialGradient id="ln-glow" cx="85%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#d2ff00" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <pattern id="ln-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.25" />
    </pattern>

    <style>
      @keyframes voltPulse {
        0%, 100% { opacity: 0.5; filter: drop-shadow(0 0 2px #d2ff00); }
        50% { opacity: 1; filter: drop-shadow(0 0 8px #d2ff00); }
      }
      @keyframes speedDash {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      .volt-glow { animation: voltPulse 3.5s ease-in-out infinite; }
      .speed-line {
        stroke-dasharray: 150 350;
        animation: speedDash 6s linear infinite;
      }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, Menlo, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="850" height="560" rx="14" fill="url(#ln-bg)" stroke="#1e293b" stroke-width="1.2" />
  
  <!-- Subtle Grid -->
  <rect width="850" height="560" rx="14" fill="url(#ln-grid)" />

  <!-- Ambient Volt Glow -->
  <rect width="850" height="560" rx="14" fill="url(#ln-glow)" />

  <!-- Dynamic Geometric LN4 Speed Streaks -->
  <path class="speed-line" d="M -50 200 L 400 200 L 550 80 L 900 80" fill="none" stroke="#d2ff00" stroke-width="2" stroke-opacity="0.4" />
  <path class="speed-line" d="M -20 220 L 380 220 L 530 100 L 900 100" fill="none" stroke="#ff8000" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- LN4 Quadrant Geometric Pattern in Top Right -->
  <g transform="translate(680, 25)" opacity="0.85">
    <polygon points="0,0 45,0 30,30 -15,30" fill="#d2ff00" />
    <polygon points="50,0 95,0 80,30 35,30" fill="#1e293b" />
    <polygon points="-20,35 25,35 10,65 -35,65" fill="#1e293b" />
    <polygon points="30,35 75,35 60,65 15,65" fill="#ff8000" />
    <text x="30" y="55" class="font-mono" font-size="18" font-weight="900" fill="#0a0e17" text-anchor="middle">#04</text>
  </g>

  <!-- Left Neon Accent Stripe -->
  <rect x="0" y="40" width="3.5" height="70" rx="1.5" fill="#d2ff00" class="volt-glow" />
  <rect x="0" y="115" width="3.5" height="25" rx="1.5" fill="#ff8000" />

  <!-- ================= HEADER SECTION ================= -->
  <g transform="translate(45, 45)">
    <!-- Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="135" height="22" rx="4" fill="#d2ff00" fill-opacity="0.12" stroke="#d2ff00" stroke-width="1" />
      <circle cx="12" cy="11" r="3.5" fill="#d2ff00" class="volt-glow" />
      <text x="24" y="15" class="font-mono" font-size="10" font-weight="bold" fill="#d2ff00" letter-spacing="1">SYSTEMS // ENG</text>
    </g>

    <!-- Main Name -->
    <text x="0" y="65" class="font-mono" font-size="38" font-weight="900" fill="#f8fafc" letter-spacing="2">
      pedroza<tspan fill="#d2ff00">.</tspan>
    </text>

    <!-- Tagline -->
    <text x="2" y="94" class="font-sans" font-size="15" fill="#94a3b8" font-weight="400" letter-spacing="0.3">
      Low-Level Computing <tspan fill="#d2ff00">•</tspan> Applied AI &amp; ML <tspan fill="#ff8000">•</tspan> Distributed Architecture
    </text>
  </g>

  <!-- Horizontal Section Divider -->
  <line x1="45" y1="165" x2="805" y2="165" stroke="#1e293b" stroke-width="1" />

  <!-- ================= ABOUT SECTION ================= -->
  <g transform="translate(45, 195)">
    <text x="0" y="0" class="font-mono" font-size="12" font-weight="bold" fill="#d2ff00" letter-spacing="1.5">// ABOUT</text>
    
    <text x="0" y="28" class="font-sans" font-size="14.5" fill="#cbd5e1" font-weight="400">
      Undergraduate engineer from Brazil driven by performance, precision, and systems design.
    </text>
    <text x="0" y="52" class="font-sans" font-size="14" fill="#94a3b8" font-weight="400">
      Focused on building memory-safe software, understanding kernel internals, and deploying
    </text>
    <text x="0" y="74" class="font-sans" font-size="14" fill="#94a3b8" font-weight="400">
      high-throughput machine learning pipelines and distributed backend services.
    </text>
  </g>

  <!-- ================= TECH STACK GRID ================= -->
  <g transform="translate(45, 315)">
    <text x="0" y="0" class="font-mono" font-size="12" font-weight="bold" fill="#d2ff00" letter-spacing="1.5">// TECH ARSENAL</text>

    <!-- Category 1: Languages -->
    <g transform="translate(0, 18)">
      <text x="0" y="16" class="font-mono" font-size="11" fill="#64748b">LANGUAGES</text>
      
      <g transform="translate(130, 0)">
        <rect x="0" y="0" width="70" height="26" rx="5" fill="#111827" stroke="#374151" stroke-width="1" />
        <text x="35" y="17" class="font-mono" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">Rust</text>

        <rect x="80" y="0" width="46" height="26" rx="5" fill="#111827" stroke="#374151" stroke-width="1" />
        <text x="103" y="17" class="font-mono" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">C</text>

        <rect x="136" y="0" width="82" height="26" rx="5" fill="#111827" stroke="#374151" stroke-width="1" />
        <text x="177" y="17" class="font-mono" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">Python</text>

        <rect x="228" y="0" width="60" height="26" rx="5" fill="#111827" stroke="#374151" stroke-width="1" />
        <text x="258" y="17" class="font-mono" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">SQL</text>

        <rect x="298" y="0" width="65" height="26" rx="5" fill="#111827" stroke="#374151" stroke-width="1" />
        <text x="330.5" y="17" class="font-mono" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">Java</text>
      </g>
    </g>

    <!-- Category 2: Tools & Environments -->
    <g transform="translate(0, 56)">
      <text x="0" y="16" class="font-mono" font-size="11" fill="#64748b">ENVIRONMENT</text>
      
      <g transform="translate(130, 0)">
        <rect x="0" y="0" width="75" height="26" rx="5" fill="#111827" stroke="#374151" stroke-width="1" />
        <text x="37.5" y="17" class="font-mono" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">Linux</text>

        <rect x="85" y="0" width="80" height="26" rx="5" fill="#111827" stroke="#374151" stroke-width="1" />
        <text x="125" y="17" class="font-mono" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">Docker</text>

        <rect x="175" y="0" width="70" height="26" rx="5" fill="#111827" stroke="#374151" stroke-width="1" />
        <text x="210" y="17" class="font-mono" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">QEMU</text>

        <rect x="255" y="0" width="55" height="26" rx="5" fill="#111827" stroke="#374151" stroke-width="1" />
        <text x="282.5" y="17" class="font-mono" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">Git</text>
      </g>
    </g>

    <!-- Category 3: Domains -->
    <g transform="translate(0, 94)">
      <text x="0" y="16" class="font-mono" font-size="11" fill="#64748b">DOMAINS</text>
      
      <g transform="translate(130, 0)">
        <rect x="0" y="0" width="160" height="26" rx="5" fill="#111827" stroke="#374151" stroke-width="1" />
        <text x="80" y="17" class="font-mono" font-size="11.5" font-weight="500" fill="#e2e8f0" text-anchor="middle">Low-Level Systems</text>

        <rect x="170" y="0" width="135" height="26" rx="5" fill="#111827" stroke="#374151" stroke-width="1" />
        <text x="237.5" y="17" class="font-mono" font-size="11.5" font-weight="500" fill="#e2e8f0" text-anchor="middle">Applied AI / ML</text>

        <rect x="315" y="0" width="155" height="26" rx="5" fill="#111827" stroke="#374151" stroke-width="1" />
        <text x="392.5" y="17" class="font-mono" font-size="11.5" font-weight="500" fill="#e2e8f0" text-anchor="middle">Embedded &amp; Arch</text>
      </g>
    </g>
  </g>

  <!-- ================= FOOTER ================= -->
  <g transform="translate(45, 490)">
    <line x1="0" y1="0" x2="760" y2="0" stroke="#1e293b" stroke-width="1" />
    
    <text x="0" y="28" class="font-mono" font-size="11" fill="#64748b">
      LN4 PRECISION // ZERO-LATENCY ENGINEERING
    </text>
    
    <g transform="translate(560, 16)">
      <text x="200" y="12" class="font-mono" font-size="11" fill="#94a3b8" text-anchor="end">guilhermebarb0sa@proton.me</text>
    </g>
  </g>

  <!-- Corner Accents -->
  <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#d2ff00" stroke-width="2" />
  <path d="M 838 24 L 838 12 L 826 12" fill="none" stroke="#ff8000" stroke-width="2" />
  <path d="M 12 536 L 12 548 L 24 548" fill="none" stroke="#1e293b" stroke-width="2" />
  <path d="M 838 536 L 838 548 L 826 548" fill="none" stroke="#d2ff00" stroke-width="2" />
</svg>
