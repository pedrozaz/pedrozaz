<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="100%" height="24">
  <defs>
    <linearGradient id="div-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea0029" stop-opacity="0.8" />
      <stop offset="25%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.4" />
      <stop offset="80%" stop-color="#334155" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0b1329" stop-opacity="0" />
    </linearGradient>
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      .pulse-item { animation: pulseGlow 2.5s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Speed Line Track -->
  <line x1="120" y1="12" x2="880" y2="12" stroke="url(#div-line-grad)" stroke-width="2" />
  
  <!-- Red Bull Triple Skewed Badges -->
  <g transform="translate(10, 5)">
    <polygon points="0,14 8,0 16,0 8,14" fill="#ea0029" />
    <polygon points="12,14 20,0 28,0 20,14" fill="#f59e0b" />
    <polygon points="24,14 32,0 40,0 32,14" fill="#00f0ff" />
  </g>

  <!-- Telemetry Sector Stamps -->
  <g transform="translate(60, 16)" class="pulse-item" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" font-weight="bold">
    <text x="0" y="0" fill="#a855f7">S1 [PURPLE]</text>
  </g>
</svg>
