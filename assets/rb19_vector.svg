<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="100%">
  <defs>
    <linearGradient id="v-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040914" />
      <stop offset="100%" stop-color="#08142b" />
    </linearGradient>

    <linearGradient id="v-flow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="v-flow2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea0029" stop-opacity="0" />
      <stop offset="50%" stop-color="#ea0029" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="v-flow3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0" />
    </linearGradient>

    <style>
      @keyframes airflowMotion {
        0% { stroke-dashoffset: 800; }
        100% { stroke-dashoffset: -800; }
      }
      @keyframes sparkParticle {
        0% { transform: translate(0, 0) scale(0.5); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translate(140px, -20px) scale(1.4); opacity: 0; }
      }
      .airflow-line1 {
        stroke-dasharray: 180 300;
        animation: airflowMotion 2.2s linear infinite;
      }
      .airflow-line2 {
        stroke-dasharray: 140 260;
        animation: airflowMotion 1.8s linear infinite reverse;
      }
      .airflow-line3 {
        stroke-dasharray: 200 350;
        animation: airflowMotion 2.6s linear infinite;
      }
      .spark-1 { animation: sparkParticle 1.2s ease-out infinite; }
      .spark-2 { animation: sparkParticle 0.9s ease-out infinite 0.3s; }
      .spark-3 { animation: sparkParticle 1.4s ease-out infinite 0.6s; }
      .font-mono { font-family: 'JetBrains Mono', Consolas, monospace; }
    </style>
  </defs>

  <!-- Container -->
  <rect width="900" height="200" rx="10" fill="url(#v-bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Speed Vortex Grid Lines -->
  <line x1="0" y1="50" x2="900" y2="50" stroke="#172554" stroke-width="0.75" stroke-dasharray="8 8" opacity="0.6" />
  <line x1="0" y1="100" x2="900" y2="100" stroke="#172554" stroke-width="0.75" stroke-dasharray="8 8" opacity="0.6" />
  <line x1="0" y1="150" x2="900" y2="150" stroke="#172554" stroke-width="0.75" stroke-dasharray="8 8" opacity="0.6" />

  <!-- Aerodynamic Streamlines Over Car -->
  <path class="airflow-line1" d="M 50 85 C 220 85, 340 50, 520 52 C 650 54, 760 70, 850 72" fill="none" stroke="url(#v-flow1)" stroke-width="3" />
  <path class="airflow-line2" d="M 30 115 C 200 115, 360 135, 540 132 C 680 130, 780 110, 870 108" fill="none" stroke="url(#v-flow2)" stroke-width="2.5" />
  <path class="airflow-line3" d="M 80 100 C 260 98, 410 80, 580 82 C 720 84, 800 95, 880 96" fill="none" stroke="url(#v-flow3)" stroke-width="2" />

  <!-- RB19 Formula 1 Car Silhouette Graphic -->
  <g transform="translate(180, 30)">
    <!-- Rear Wing -->
    <path d="M 60 45 L 85 45 L 80 115 L 55 115 Z" fill="#0b172a" stroke="#ea0029" stroke-width="2" />
    <rect x="58" y="55" width="25" height="5" fill="#f59e0b" />
    <!-- Rear Wing Endplate DRS -->
    <line x1="58" y1="42" x2="85" y2="42" stroke="#00f0ff" stroke-width="3" />

    <!-- Main Chassis & Engine Cover -->
    <path d="M 85 75 C 140 68, 220 60, 310 68 C 360 72, 420 82, 490 85 L 490 92 C 420 95, 360 105, 310 108 C 220 116, 140 108, 85 102 Z" fill="#071126" stroke="#334155" stroke-width="1.5" />

    <!-- Red Bull Yellow Nosecone & Red Bull Bull Motif Silhouette -->
    <path d="M 430 84 L 495 86 L 495 91 L 430 93 Z" fill="#f59e0b" />
    <path d="M 280 72 C 320 70, 360 74, 400 80 L 400 96 C 360 102, 320 106, 280 104 Z" fill="#ea0029" opacity="0.85" />

    <!-- Cockpit & Halo -->
    <path d="M 260 75 C 290 73, 315 78, 335 83 L 335 94 C 315 99, 290 104, 260 102 Z" fill="#020617" stroke="#64748b" stroke-width="1" />
    <!-- Driver Helmet (Verstappen Gold/White) -->
    <circle cx="285" cy="88" r="6" fill="#fbbf24" stroke="#f8fafc" stroke-width="1" />

    <!-- Sidepods -->
    <path d="M 170 52 C 230 48, 270 56, 310 68 L 310 74 C 270 66, 230 60, 170 65 Z" fill="#0b172a" stroke="#1e293b" stroke-width="1" />
    <path d="M 170 125 C 230 129, 270 121, 310 109 L 310 103 C 270 111, 230 117, 170 112 Z" fill="#0b172a" stroke="#1e293b" stroke-width="1" />

    <!-- Floor / Venturi Tunnels Edge -->
    <line x1="140" y1="48" x2="330" y2="62" stroke="#ea0029" stroke-width="2" />
    <line x1="140" y1="129" x2="330" y2="115" stroke="#ea0029" stroke-width="2" />

    <!-- Front Wing Assembly -->
    <path d="M 480 50 L 515 52 L 520 86 L 475 84 Z" fill="#071126" stroke="#00f0ff" stroke-width="1.5" />
    <path d="M 480 127 L 515 125 L 520 91 L 475 93 Z" fill="#071126" stroke="#00f0ff" stroke-width="1.5" />
    <!-- Front Wing Flaps -->
    <line x1="485" y1="58" x2="520" y2="60" stroke="#f59e0b" stroke-width="1.5" />
    <line x1="485" y1="119" x2="520" y2="117" stroke="#f59e0b" stroke-width="1.5" />

    <!-- Wheels / Pirelli P-Zero Softs (Red Band) -->
    <!-- Rear Left -->
    <rect x="110" y="30" width="52" height="24" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="2" />
    <!-- Rear Right -->
    <rect x="110" y="123" width="52" height="24" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="2" />
    <!-- Front Left -->
    <rect x="420" y="34" width="48" height="20" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="2" />
    <!-- Front Right -->
    <rect x="420" y="123" width="48" height="20" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="2" />

    <!-- Sparks From Titanium Skid Block -->
    <g class="spark-1" transform="translate(100, 88)">
      <circle cx="0" cy="0" r="2" fill="#ffedd5" />
      <line x1="0" y1="0" x2="15" y2="-4" stroke="#f59e0b" stroke-width="1.5" />
    </g>
    <g class="spark-2" transform="translate(110, 85)">
      <circle cx="0" cy="0" r="1.5" fill="#ffffff" />
      <line x1="0" y1="0" x2="20" y2="6" stroke="#ea0029" stroke-width="1.5" />
    </g>
    <g class="spark-3" transform="translate(95, 92)">
      <circle cx="0" cy="0" r="2.5" fill="#fde047" />
      <line x1="0" y1="0" x2="18" y2="-8" stroke="#ffedd5" stroke-width="2" />
    </g>
  </g>

  <!-- HUD Specs Overlay -->
  <g transform="translate(30, 25)">
    <text x="0" y="0" class="font-mono" font-size="11" font-weight="bold" fill="#ea0029" letter-spacing="1.5">VEHICLE TELEMETRY</text>
    <text x="0" y="20" class="font-mono" font-size="18" font-weight="900" fill="#f8fafc" letter-spacing="1">RB19 // SPEC-01</text>
    
    <g transform="translate(0, 36)">
      <text x="0" y="12" class="font-mono" font-size="10" fill="#64748b">POWER UNIT: <tspan fill="#f8fafc">HONDA RBPTH001 1.6L V6 TURBO</tspan></text>
      <text x="0" y="28" class="font-mono" font-size="10" fill="#64748b">CHASSIS: <tspan fill="#f8fafc">CARBON-COMPOSITE MONOCOQUE</tspan></text>
      <text x="0" y="44" class="font-mono" font-size="10" fill="#64748b">TARGET: <tspan fill="#22c55e">SUB-MILLISECOND LATENCY &amp; MAX THROUGHPUT</tspan></text>
    </g>
  </g>

  <!-- Right Side Stats Badge -->
  <g transform="translate(740, 30)">
    <rect width="130" height="140" rx="8" fill="#040814" stroke="#1e293b" stroke-width="1" />
    
    <text x="14" y="24" class="font-mono" font-size="9" fill="#64748b">FASTEST LAP</text>
    <text x="14" y="44" class="font-mono" font-size="15" font-weight="bold" fill="#a855f7">1:18.234</text>

    <line x1="14" y1="56" x2="116" y2="56" stroke="#1e293b" stroke-width="1" />

    <text x="14" y="74" class="font-mono" font-size="9" fill="#64748b">TOP SPEED</text>
    <text x="14" y="94" class="font-mono" font-size="15" font-weight="bold" fill="#00f0ff">352 <tspan font-size="10" fill="#64748b">km/h</tspan></text>

    <line x1="14" y1="106" x2="116" y2="106" stroke="#1e293b" stroke-width="1" />

    <text x="14" y="124" class="font-mono" font-size="9" font-weight="bold" fill="#ea0029">MAX // #01</text>
  </g>
</svg>
