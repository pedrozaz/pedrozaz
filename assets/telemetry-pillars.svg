<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091326" />
      <stop offset="100%" stop-color="#040814" />
    </linearGradient>

    <linearGradient id="glow-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea0029" />
      <stop offset="100%" stop-color="#ea0029" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glow-yellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      @keyframes telemetryBlink {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      .live-tag { animation: telemetryBlink 2s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Card 1: Low-Level & Embedded -->
  <g transform="translate(10, 10)">
    <rect width="275" height="170" rx="8" fill="url(#card-bg-1)" stroke="#1e293b" stroke-width="1.5" />
    <rect width="275" height="4" rx="2" fill="#ea0029" />
    
    <!-- Header -->
    <g transform="translate(18, 26)">
      <circle cx="4" cy="4" r="3.5" fill="#ea0029" class="live-tag" />
      <text x="14" y="8" class="mono" font-size="10" font-weight="bold" fill="#ea0029" letter-spacing="1">CH_01 // LOW-LEVEL</text>
      <text x="210" y="8" class="mono" font-size="9" fill="#64748b">C / RUST</text>
    </g>

    <line x1="18" y1="42" x2="257" y2="42" stroke="#1e293b" stroke-width="1" />

    <!-- Content -->
    <g transform="translate(18, 62)">
      <text x="0" y="0" class="sans" font-size="14" font-weight="bold" fill="#f8fafc">Systems &amp; Embedded</text>
      <text x="0" y="20" class="sans" font-size="12" fill="#94a3b8">Bare-metal mechanics, kernel concepts,</text>
      <text x="0" y="38" class="sans" font-size="12" fill="#94a3b8">emulation &amp; hardware virtualization.</text>
      
      <!-- Telemetry Tags -->
      <g transform="translate(0, 56)">
        <rect x="0" y="0" width="46" height="18" rx="3" fill="#1e293b" />
        <text x="23" y="12.5" class="mono" font-size="9.5" fill="#f8fafc" text-anchor="middle">Rust</text>

        <rect x="52" y="0" width="30" height="18" rx="3" fill="#1e293b" />
        <text x="67" y="12.5" class="mono" font-size="9.5" fill="#f8fafc" text-anchor="middle">C</text>

        <rect x="88" y="0" width="50" height="18" rx="3" fill="#1e293b" />
        <text x="113" y="12.5" class="mono" font-size="9.5" fill="#f8fafc" text-anchor="middle">Linux</text>

        <rect x="144" y="0" width="50" height="18" rx="3" fill="#1e293b" />
        <text x="169" y="12.5" class="mono" font-size="9.5" fill="#f8fafc" text-anchor="middle">QEMU</text>
      </g>
    </g>
  </g>

  <!-- Card 2: Applied AI & ML -->
  <g transform="translate(312, 10)">
    <rect width="275" height="170" rx="8" fill="url(#card-bg-1)" stroke="#1e293b" stroke-width="1.5" />
    <rect width="275" height="4" rx="2" fill="#f59e0b" />
    
    <!-- Header -->
    <g transform="translate(18, 26)">
      <circle cx="4" cy="4" r="3.5" fill="#f59e0b" class="live-tag" />
      <text x="14" y="8" class="mono" font-size="10" font-weight="bold" fill="#f59e0b" letter-spacing="1">CH_02 // APPLIED AI</text>
      <text x="200" y="8" class="mono" font-size="9" fill="#64748b">MODELS</text>
    </g>

    <line x1="18" y1="42" x2="257" y2="42" stroke="#1e293b" stroke-width="1" />

    <!-- Content -->
    <g transform="translate(18, 62)">
      <text x="0" y="0" class="sans" font-size="14" font-weight="bold" fill="#f8fafc">Machine Intelligence</text>
      <text x="0" y="20" class="sans" font-size="12" fill="#94a3b8">Applied ML pipelines, intelligent agents,</text>
      <text x="0" y="38" class="sans" font-size="12" fill="#94a3b8">and high-efficiency neural inference.</text>
      
      <!-- Telemetry Tags -->
      <g transform="translate(0, 56)">
        <rect x="0" y="0" width="60" height="18" rx="3" fill="#1e293b" />
        <text x="30" y="12.5" class="mono" font-size="9.5" fill="#f8fafc" text-anchor="middle">Python</text>

        <rect x="66" y="0" width="60" height="18" rx="3" fill="#1e293b" />
        <text x="96" y="12.5" class="mono" font-size="9.5" fill="#f8fafc" text-anchor="middle">PyTorch</text>

        <rect x="132" y="0" width="62" height="18" rx="3" fill="#1e293b" />
        <text x="163" y="12.5" class="mono" font-size="9.5" fill="#f8fafc" text-anchor="middle">LLM Apps</text>
      </g>
    </g>
  </g>

  <!-- Card 3: Backend & Distributed Systems -->
  <g transform="translate(614, 10)">
    <rect width="275" height="170" rx="8" fill="url(#card-bg-1)" stroke="#1e293b" stroke-width="1.5" />
    <rect width="275" height="4" rx="2" fill="#00f0ff" />
    
    <!-- Header -->
    <g transform="translate(18, 26)">
      <circle cx="4" cy="4" r="3.5" fill="#00f0ff" class="live-tag" />
      <text x="14" y="8" class="mono" font-size="10" font-weight="bold" fill="#00f0ff" letter-spacing="1">CH_03 // ARCHITECTURE</text>
      <text x="195" y="8" class="mono" font-size="9" fill="#64748b">THROUGHPUT</text>
    </g>

    <line x1="18" y1="42" x2="257" y2="42" stroke="#1e293b" stroke-width="1" />

    <!-- Content -->
    <g transform="translate(18, 62)">
      <text x="0" y="0" class="sans" font-size="14" font-weight="bold" fill="#f8fafc">Backend &amp; Distributed</text>
      <text x="0" y="20" class="sans" font-size="12" fill="#94a3b8">Robust services, relational data engines,</text>
      <text x="0" y="38" class="sans" font-size="12" fill="#94a3b8">scalable and concurrent architectures.</text>
      
      <!-- Telemetry Tags -->
      <g transform="translate(0, 56)">
        <rect x="0" y="0" width="45" height="18" rx="3" fill="#1e293b" />
        <text x="22.5" y="12.5" class="mono" font-size="9.5" fill="#f8fafc" text-anchor="middle">SQL</text>

        <rect x="51" y="0" width="45" height="18" rx="3" fill="#1e293b" />
        <text x="73.5" y="12.5" class="mono" font-size="9.5" fill="#f8fafc" text-anchor="middle">Java</text>

        <rect x="102" y="0" width="58" height="18" rx="3" fill="#1e293b" />
        <text x="131" y="12.5" class="mono" font-size="9.5" fill="#f8fafc" text-anchor="middle">Docker</text>

        <rect x="166" y="0" width="42" height="18" rx="3" fill="#1e293b" />
        <text x="187" y="12.5" class="mono" font-size="9.5" fill="#f8fafc" text-anchor="middle">Git</text>
      </g>
    </g>
  </g>
</svg>
